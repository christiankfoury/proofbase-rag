services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proofbase-postgres
    environment:
      POSTGRES_DB: enterprise_knowledge_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_knowledge_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proofbase-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: proofbase-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_knowledge_agent
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      AUTH_MODE: ${AUTH_MODE:-local_demo}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://identity.local.proofbase.invalid}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-proofbase-api}
      OIDC_LOCAL_SIGNING_SECRET: ${OIDC_LOCAL_SIGNING_SECRET:-}
      OIDC_FUTURE_PROVIDER: ${OIDC_FUTURE_PROVIDER:-microsoft_entra_id}
      SESSION_ABSOLUTE_MINUTES: ${SESSION_ABSOLUTE_MINUTES:-480}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      DEFAULT_DEMO_TENANT_ID: ${DEFAULT_DEMO_TENANT_ID:-00000000-0000-0000-0000-000000002801}
      DATABASE_ENFORCE_RLS: ${DATABASE_ENFORCE_RLS:-true}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-proofbase_runtime}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: redis://redis:6379/0
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-12000000}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-4000}
      TENANT_DAILY_AI_BUDGET_USD: ${TENANT_DAILY_AI_BUDGET_USD:-5.0}
      EXTERNAL_AI_MAX_RETRIES: ${EXTERNAL_AI_MAX_RETRIES:-1}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OBSERVABILITY_LOG_PATH: ${OBSERVABILITY_LOG_PATH:-data/observability/request-logs.jsonl}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-data/audit/audit-events.jsonl}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets:
      - openai_api_key

  file-parser-contract:
    profiles: ["security-contract"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.api.app.files.secure_parser_worker"]
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    container_name: proofbase-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

secrets:
  openai_api_key:
    environment: OPENAI_API_KEY
