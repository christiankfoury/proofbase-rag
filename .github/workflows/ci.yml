name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall apps scripts

      - name: Scan source for secrets
        run: python scripts/scan_phase60_secrets.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Scan frontend build output for secrets
        run: python scripts/scan_phase60_secrets.py --scan-path apps/web/.next --include-build-output

      - name: Docker build API
        run: docker build -f apps/api/Dockerfile -t proofbase-api:ci .

      - name: Scan API image for secrets
        run: python scripts/scan_phase60_secrets.py --container-image proofbase-api:ci

      - name: Docker build web
        run: docker build -f apps/web/Dockerfile -t proofbase-web:ci .
